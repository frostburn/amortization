name: Check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full_browser:
        description: Run the full browser regression suite
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps --only-shell chromium
      - name: Browser smoke tests
        if: ${{ !inputs.full_browser }}
        run: npm run test:e2e:smoke -- --reporter=list
      - name: Full browser regressions
        if: ${{ inputs.full_browser }}
        run: npm run test:e2e -- --reporter=list
